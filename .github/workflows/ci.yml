name: evals
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ttsr-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Pinned: evals exercise the omp ttsr matcher; an upstream matcher change
      # must not break CI without a plugin diff. Bump deliberately.
      - run: bun add -g @oh-my-pi/pi-coding-agent@17.3.8
      - run: bun evals/run.ts
